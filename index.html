          <script>
    /* =====================================================================
       AUDIO SYNTHESIZER (Web Audio API)
       ===================================================================== */
    let audioCtx = null;
    let audioEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
    }

    function playSound(type) {
      if (!audioEnabled) return;
      initAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'success') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
        osc.start(now);
        osc.stop(now + 0.5);
      } else if (type === 'fail') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(240, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.35);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'swordHum') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.4);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'magic') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350, now);
        osc.frequency.exponentialRampToValueAtTime(1400, now + 0.6);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
        osc.start(now);
        osc.stop(now + 0.6);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('sound-label').innerText = audioEnabled ? 'Audio: ON' : 'Audio: OFF';
      if (audioEnabled) playSound('click');
    }

    /* =====================================================================
       ENHANCED DETAILED SVG FACTORY (Rich Vector Illustrations)
       ===================================================================== */

          <path d="M-30 0 L0 30 L30 0 L0 100 Z" fill="#2E1065" />

          <!-- Glowing Void Eyes -->
          <ellipse cx="-15" cy="-25" rx="6" ry="3" fill="#E9D5FF" filter="url(#glowCyan)" />
          <ellipse cx="15" cy="-25" rx="6" ry="3" fill="#E9D5FF" filter="url(#glowCyan)" />

    const SVGFactory = {
      // Scene 1: Village under Eternal Night
      village: () => `
        <svg viewBox="0 0 700 450" class="w-full h-full rounded-xl">
          ${SVGDefs}
          <rect width="700" height="450" fill="url(#skyCursed)"/>

          <!-- Swirling Cursed Clouds -->

          <!-- Background Mountain Silhouettes -->
          <path d="M0 320 L140 180 L260 270 L420 150 L580 290 L700 200 L700 450 L0 450 Z" fill="#0F172A"/>
          <path d="M0 350 L180 240 L340 320 L500 210 L700 340 L700 450 L0 450 Z" fill="#090D16"/>

          <polygon points="120,360 190,300 260,360" fill="#1E293B" stroke="#334155" stroke-width="2"/>

          <!-- Glowing purple cursed window -->

    let inventory = { scroll: false, key: false, crystal: false };

    /* =====================================================================
       INTERACTIVE PUZZLE LOGIC
       ===================================================================== */
    let currentRuneSeq = [];
    const targetRuneSeq = ["Dawn", "Sol", "Dusk", "Eclipse"];

    function renderRunePuzzle() {
      const puzzleContainer = document.getElementById('puzzle-container');
      puzzleContainer.classList.remove('hidden');
      puzzleContainer.innerHTML = `
        <div class="text-center">
          <p class="text-xs text-amber-300 font-semibold mb-2">Select Runes in celestial order: Dawn &rarr; Sol &rarr; Dusk &rarr; Eclipse</p>
          <div class="flex flex-wrap justify-center gap-2 mb-3">
            ${['Sol', 'Dawn', 'Eclipse', 'Dusk'].sort(() => Math.random() - 0.5).map(rune => `
              <button onclick="pressRune('${rune}')" class="px-3.5 py-2 bg-slate-800 hover:bg-amber-500/30 border border-amber-500/60 rounded-lg text-amber-200 text-xs font-serif font-bold transition shadow-md hover:scale-105">
                ᚱ ${rune}
              </button>
            `).join('')}
          </div>
          <div class="text-xs text-slate-400">Sequence: <span id="rune-input" class="text-amber-400 font-mono font-bold">${currentRuneSeq.join(' &rarr; ')}</span></div>
          <button onclick="resetRunePuzzle()" class="mt-2 text-[11px] text-slate-500 hover:text-slate-300 underline">Reset Order</button>
        </div>
      `;
    }

    function pressRune(rune) {
      playSound('click');
      currentRuneSeq.push(rune);
      document.getElementById('rune-input').innerHTML = currentRuneSeq.join(' &rarr; ');

      if (currentRuneSeq.length === targetRuneSeq.length) {
        if (JSON.stringify(currentRuneSeq) === JSON.stringify(targetRuneSeq)) {
          playSound('success');
          inventory.scroll = true;
          updateInventoryUI();
          document.getElementById('puzzle-container').classList.add('hidden');
          currentRuneSeq = [];
          renderScene('moonTemple');
        } else {
          playSound('fail');
          alert('The runes flare red and reset! Hint: Dawn -> Sol -> Dusk -> Eclipse');
          resetRunePuzzle();
        }
      }
    }

    function resetRunePuzzle() {
      currentRuneSeq = [];
      const inputEl = document.getElementById('rune-input');
      if (inputEl) inputEl.innerText = '';
    }

    // Moon Crystal Pillar Puzzle
    let pillarAngles = [0, 0, 0];
    function renderCrystalPuzzle() {
      const puzzleContainer = document.getElementById('puzzle-container');
      puzzleContainer.classList.remove('hidden');
      puzzleContainer.innerHTML = `
        <div class="text-center">
          <p class="text-xs text-cyan-300 font-semibold mb-2">Rotate all 3 Crystal Pillars to 180° to focus moonlight!</p>
          <div class="flex justify-center gap-4 mb-3">
            ${[0, 1, 2].map(idx => `
              <div class="flex flex-col items-center">
                <span class="text-[10px] text-slate-400 mb-1">Pillar ${idx + 1}</span>
                <button onclick="rotatePillar(${idx})" class="w-12 h-12 bg-slate-800 border border-cyan-400/60 rounded-full text-cyan-300 text-xs font-bold flex items-center justify-center glow-moon-lg hover:scale-110 transition">
                  <span id="pillar-${idx}">${pillarAngles[idx]}°</span>
                </button>
              </div>
            `).join('')}
          </div>
          <button onclick="checkCrystalPuzzle()" class="px-5 py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-xs rounded-lg shadow-lg transition">
            Focus Lunar Energy
          </button>
        </div>
      `;
    }

    function rotatePillar(index) {
      playSound('click');
      pillarAngles[index] = (pillarAngles[index] + 60) % 360;
      document.getElementById(`pillar-${index}`).innerText = `${pillarAngles[index]}°`;
    }

    function checkCrystalPuzzle() {
      if (pillarAngles.every(angle => angle === 180)) {
        playSound('magic');
        inventory.key = true;
        inventory.crystal = true;
        updateInventoryUI();
        document.getElementById('puzzle-container').classList.add('hidden');
        renderScene('throneRoom');
      } else {
        playSound('fail');
        alert('The light beam misses the lock! Set all pillars to 180°.');
      }
    }

    function updateInventoryUI() {
      if (inventory.scroll) {
        const scrollEl = document.getElementById('inv-scroll');
        scrollEl.classList.remove('opacity-40', 'text-slate-500', 'bg-slate-900');
        scrollEl.classList.add('bg-amber-950/50', 'border-amber-500/50', 'text-amber-300', 'glow-sun-lg');
      }
      if (inventory.key) {
        const keyEl = document.getElementById('inv-key');
        keyEl.classList.remove('opacity-40', 'text-slate-500', 'bg-slate-900');
        keyEl.classList.add('bg-cyan-950/50', 'border-cyan-500/50', 'text-cyan-300', 'glow-moon-lg');
      }
      if (inventory.crystal) {
        const crystalEl = document.getElementById('inv-crystal');
        crystalEl.classList.remove('opacity-40', 'text-slate-500', 'bg-slate-900');
        crystalEl.classList.add('bg-sky-950/50', 'border-sky-500/50', 'text-sky-300', 'glow-moon-lg');
      }
    }

    function renderScene(nodeKey) {
      const node = storyNodes[nodeKey];
      if (!node) return;

      // Update Fear Bar
      const fearBar = document.getElementById('fear-bar');
      fearBar.style.width = `${node.fear}%`;

      // Update Header & Location badge
      document.getElementById('chapter-title').innerText = node.chapter;
      document.getElementById('location-text').innerText = node.location;

      // Render Dynamic SVG Graphic
      const viewport = document.getElementById('svg-viewport');
      if (SVGFactory[node.svg]) {
        viewport.innerHTML = SVGFactory[node.svg]();
      }

      // Smooth story text update
      const storyTextEl = document.getElementById('story-text');
      storyTextEl.style.opacity = '0';
      setTimeout(() => {
        storyTextEl.innerText = node.text;
        storyTextEl.style.opacity = '1';
      }, 150);

      // Handle Choices & Puzzles
      const choicesContainer = document.getElementById('choices-container');
      const puzzleContainer = document.getElementById('puzzle-container');
      choicesContainer.innerHTML = '';

      if (node.puzzleType === 'runeGate') {
        renderRunePuzzle();
      } else if (node.puzzleType === 'crystalAlign') {
        renderCrystalPuzzle();
      } else {
        puzzleContainer.classList.add('hidden');
        node.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = "w-full py-3 px-4 rounded-xl bg-slate-800/90 hover:bg-amber-500/20 border border-slate-700 hover:border-amber-500/70 text-left text-slate-200 hover:text-amber-300 font-medium text-xs md:text-sm transition-all flex items-center justify-between group shadow-md hover:scale-[1.01]";
          btn.innerHTML = `
            <span>${choice.text}</span>
            <svg class="w-4 h-4 text-slate-500 group-hover:text-amber-400 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
          `;
          btn.onclick = () => {
            playSound('click');
            if (choice.nextNode === 'start') {
              inventory = { scroll: false, key: false, crystal: false };
              document.querySelectorAll('.inventory-item').forEach((el, idx) => {
                if (idx > 0) {
                  el.className = "inventory-item opacity-40 flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-900 border border-slate-800 text-slate-500 font-medium transition-all";
                }
              });
            }
            renderScene(choice.nextNode);
          };
          choicesContainer.appendChild(btn);
        });
      }
    }

    // Initialize Game on Load
    window.onload = function() {
      renderScene('start');
    };
